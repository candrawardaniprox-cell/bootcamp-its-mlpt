kind: Deployment
apiVersion: apps/v1
metadata:
  name: my-container
  labels:
    app: my-container
spec:
  replicas: 5
  selector:
    matchLabels:
      app: my-container
  template:
    metadata:
      labels:
        app: my-container
    spec:
      containers:
        - name: my-container
          image: default-route-openshift-image-registry.apps.rm1.0a51.p1.openshiftapps.com/danicandrawardani-dev/dani:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb-internal:27017"