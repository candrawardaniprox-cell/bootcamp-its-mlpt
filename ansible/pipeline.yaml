---
- name: CI/CD Pipeline - Git, Podman Build, Push, and OCP Restart
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: 1. Clone the Git repository
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_dest }}"
        version: "{{ git_branch }}"
        force: yes

    - name: 2. Login to the Image Registry
      ansible.builtin.command: >
        podman login {{ image_registry.split('/')[0] }} -u "{{ registry_user }}" -p "{{ registry_password }}"
      # Hiding log output so your password doesn't print in AAP logs
      no_log: true 

    - name: 3. Build the container image using Podman
      ansible.builtin.command: >
        podman build -t {{ image_registry }}:{{ image_tag }} {{ git_dest }}
      register: podman_build_output

    - name: Print Build Output
      ansible.builtin.debug:
        var: podman_build_output.stdout_lines

    - name: 4. Push the container image to the registry
      ansible.builtin.command: >
        podman push {{ image_registry }}:{{ image_tag }}
      register: podman_push_output

    - name: Print Push Output
      ansible.builtin.debug:
        var: podman_push_output.stdout_lines

    - name: 5. Trigger Rollout Restart on the OpenShift Deployment
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app_name }}"
        namespace: "{{ namespace }}"
        state: patched
        definition:
          spec:
            template:
              metadata:
                annotations:
                  # This annotation exactly replicates the 'oc rollout restart' behavior
                  "kubectl.kubernetes.io/restartedAt": "{{ now(fmt='%Y-%m-%dT%H:%M:%SZ') }}"